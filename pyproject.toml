[tool.poetry]
name = "HM-ScalableRecs"
version = "0.1.0"
description = "Let's build a production-ready recommendation system using the H&M Personalized Fashion dataset."
authors = ["Luong Nguyen Dinh <luongnguyendinhgreen@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "3.11.9"
datasets = "^2.21.0"
pandas = "^2.2.2"
loguru = "^0.7.2"
mlflow = "^2.15.1"
python-dotenv = "^1.0.1"
pydantic = "^2.8.2"
fire = "^0.7.0"
load-dotenv = "^0.1.0"
tqdm = "^4.67.1"
acryl-datahub = "^0.14.1.12"
evidently = "^0.4.40"
sqlalchemy = "^2.0.36"
psycopg2 = "^2.9.10"
feast = {extras = ["postgres"], version = "^0.42.0"}
torch = {version = "^2.5.1+cu121", source = "pytorch"}
torchvision = {version = "^0.20.1+cu121", source = "pytorch"}
torchaudio = {version = "^2.5.1+cu121", source = "pytorch"}
lightning = "^2.5.0.post0"
qdrant-client = {extras = ["fastembed"], version = "^1.13.2"}

[tool.poetry.group.dev.dependencies]
jupyterlab = "^4.2.4"
ipywidgets = "^8.1.3"
seaborn = "^0.13.2"
matplotlib = "^3.9.2"
black = "^24.10.0"
isort = "^5.13.2"
dvc = {extras = ["s3"], version = "^3.58.0"}
tensorboard = "^2.18.0"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
force_sort_within_sections = true
